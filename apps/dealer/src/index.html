<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>dealer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the persisted/system colour scheme before first paint (no FOUC).
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (
            t === 'dark' ||
            ((t === 'system' || !t) && matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <dealer-root></dealer-root>
  </body>
</html>
