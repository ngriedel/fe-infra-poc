<main class="container mx-auto flex min-h-screen flex-col items-center justify-center gap-6 p-8">
  <h1 class="text-4xl font-semibold tracking-tight">{{ title }}</h1>
  <p class="text-muted-foreground">Tailwind + Spartan-style button smoke test.</p>

  <div class="flex flex-wrap items-center gap-3">
    <button hlmBtn>Primary</button>
    <button hlmBtn variant="secondary">Secondary</button>
    <button hlmBtn variant="outline">Outline</button>
    <button hlmBtn variant="ghost">Ghost</button>
    <button hlmBtn variant="destructive">Destructive</button>
    <button hlmBtn variant="link">Link</button>
  </div>

  <div class="flex flex-wrap items-center gap-3">
    <button hlmBtn size="sm">Small</button>
    <button hlmBtn>Default</button>
    <button hlmBtn size="lg">Large</button>
    <button hlmBtn size="icon" aria-label="Action">★</button>
  </div>

  <router-outlet></router-outlet>
</main>
